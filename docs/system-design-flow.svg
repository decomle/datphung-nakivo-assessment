<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">Production job-processing flow at one million jobs per day</title>
  <desc id="description">Clients submit jobs to an API. Jobs are persisted to a database and an outbox publishes job IDs to a durable broker. Workers claim jobs with leases, process them, and persist results. Retries use backoff and exhausted failures go to a dead-letter queue. Observability monitors every component.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526075; }
      .box { stroke-width: 2; rx: 14; }
      .label { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .detail { font-size: 14px; text-anchor: middle; fill: #526075; }
      .arrow { stroke: #526075; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .retry { stroke: #d97706; stroke-width: 3; fill: none; marker-end: url(#retryhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526075"/></marker>
    <marker id="retryhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
  </defs>
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="70" y="62" class="title">Job Processing Service — production flow (1M jobs/day)</text>
  <text x="70" y="92" class="subtitle">Durable hand-offs, bounded retries, idempotent workers, and observable horizontal scaling</text>

  <rect x="70" y="190" width="170" height="105" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="155" y="232" class="label">Clients</text><text x="155" y="258" class="detail">submit jobs</text>

  <rect x="315" y="165" width="220" height="155" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="425" y="211" class="label">Stateless API</text><text x="425" y="238" class="detail">validate request</text><text x="425" y="260" class="detail">create job + outbox</text><text x="425" y="282" class="detail">return job ID</text>

  <rect x="620" y="120" width="220" height="125" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="730" y="164" class="label">Jobs Database</text><text x="730" y="191" class="detail">source of truth</text><text x="730" y="213" class="detail">status, lease, retries</text>

  <rect x="620" y="315" width="220" height="105" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="730" y="357" class="label">Outbox Publisher</text><text x="730" y="383" class="detail">transactional relay</text>

  <rect x="925" y="315" width="220" height="105" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1035" y="357" class="label">Durable Broker</text><text x="1035" y="383" class="detail">buffer + back-pressure</text>

  <rect x="925" y="120" width="220" height="125" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1035" y="164" class="label">Worker Pool</text><text x="1035" y="191" class="detail">claim with lease</text><text x="1035" y="213" class="detail">idempotent handler</text>

  <rect x="1190" y="315" width="150" height="105" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1265" y="357" class="label">DLQ</text><text x="1265" y="383" class="detail">manual review</text>

  <rect x="260" y="540" width="880" height="120" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="700" y="582" class="label">Operational feedback loop</text><text x="700" y="610" class="detail">metrics: queue depth, latency, failure rate · traces + correlation IDs · alerts · autoscale API and worker replicas</text><text x="700" y="635" class="detail">lease expiry recovers abandoned PROCESSING jobs · retention/archive keeps the active table small</text>

  <path d="M240 242 H315" class="arrow"/>
  <path d="M535 205 H620" class="arrow"/>
  <path d="M730 245 V315" class="arrow"/>
  <path d="M840 367 H925" class="arrow"/>
  <path d="M1035 315 V245" class="arrow"/>
  <path d="M925 182 H840" class="arrow"/>
  <path d="M1145 367 H1190" class="retry"/>
  <path d="M1035 245 V285 C1035 285 905 285 905 367 H925" class="retry"/>
  <text x="850" y="275" font-size="14" fill="#d97706">retry with exponential backoff</text>
  <path d="M730 420 V500" class="arrow"/>
  <path d="M1035 420 V500" class="arrow"/>
</svg>
